server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: sentinel-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/sentinel}
    username: ${DATABASE_USERNAME:sentinel}
    password: ${DATABASE_PASSWORD:sentinel}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

# --- JWT / refresh token (Prompt 03) -------------------------------------
# Dev/test: JWT_SECRET vazia → segredo HS256 efêmero gerado no startup (WARNING
# no log; reiniciar invalida tokens emitidos). Prod exige o valor real via
# `jwt.secret: ${JWT_SECRET:?...}` em application-prod.yml (fail-fast).
jwt:
  secret: ${JWT_SECRET:}
  access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:900}   # 15 min
  refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}         # 7 dias
  cookie:
    name: ${JWT_COOKIE_NAME:refresh_token}
    path: ${JWT_COOKIE_PATH:/api/v1/auth}
    secure: ${JWT_COOKIE_SECURE:false}                # prod força true
    same-site: ${JWT_COOKIE_SAME_SITE:Strict}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never # não expor detalhes sensíveis
