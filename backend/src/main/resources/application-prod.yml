logging:
  level:
    com.sentinel: INFO

spring:
  datasource:
    # Fail-fast no perfil prod: sem fallback fraco (o default "sentinel" do
    # application.yml base continua valendo apenas para dev local).
    password: ${DATABASE_PASSWORD:?DATABASE_PASSWORD é obrigatória no perfil prod}
    url: ${DATABASE_URL:?DATABASE_URL é obrigatória no perfil prod}
    username: ${DATABASE_USERNAME:?DATABASE_USERNAME é obrigatório no perfil prod}
  jpa:
    show-sql: false
  flyway:
    validate-on-migrate: true

jwt:
  # Fail-fast no perfil prod: sem segredo fraco/gerado em runtime. O valor deve
  # ter >= 32 caracteres (HS256 exige >= 256 bits) — validado no startup.
  # NUNCA versionar o secret; injete via ambiente.
  secret: ${JWT_SECRET:?JWT_SECRET é obrigatória no perfil prod}
  cookie:
    # Cookies só via HTTPS em produção (o navegador não persiste cookie Secure em HTTP).
    secure: true
