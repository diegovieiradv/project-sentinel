name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21 (Temurin) with Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run backend tests
        run: mvn -B test
      - name: Upload Surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7
          if-no-files-found: ignore

  frontend-test:
    name: Frontend Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 22 with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run type-check
      - name: Unit tests (Vitest)
        run: npm run test
      - name: Build (Next.js)
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend-test, frontend-test]
    # Executa somente em pull requests (runners ubuntu-latest são Linux).
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21 (Temurin) with Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Set up Node 22 with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start PostgreSQL (docker compose)
        run: docker compose up -d --wait
      - name: Start backend (test profile)
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: test
          DATABASE_PASSWORD: sentinel
          JWT_SECRET: ci-e2e-test-secret-not-for-production-0123456789
          CORS_ALLOWED_ORIGINS: http://localhost:3000
        run: |
          nohup mvn -B spring-boot:run > ../backend-run.log 2>&1 &
          echo $! > ../backend.pid
      - name: Wait for backend readiness
        working-directory: backend
        run: |
          for _ in $(seq 1 90); do
            if curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Backend UP"
              exit 0
            fi
            sleep 2
          done
          echo "Backend não subiu em 180s" >&2
          cat ../backend-run.log
          exit 1
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend (production)
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
        run: npm run build
      - name: Start frontend (production server)
        working-directory: frontend
        run: |
          nohup npm run start > ../frontend-start.log 2>&1 &
          echo $! > ../frontend.pid
      - name: Wait for frontend readiness
        working-directory: frontend
        run: |
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:3000 >/dev/null; then
              echo "Frontend UP"
              exit 0
            fi
            sleep 2
          done
          echo "Frontend não subiu em 60s" >&2
          cat ../frontend-start.log
          exit 1
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run Playwright E2E tests
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
      - name: Stop backend and frontend
        if: always()
        run: |
          if [ -f backend.pid ]; then kill "$(cat backend.pid)" 2>/dev/null || true; fi
          if [ -f frontend.pid ]; then kill "$(cat frontend.pid)" 2>/dev/null || true; fi
      - name: Stop PostgreSQL
        if: always()
        run: docker compose down -v
